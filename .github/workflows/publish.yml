name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          include-prerelease: true
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Extract version from release tag
        id: get_version
        shell: bash
        run: |
          ref='${{ github.event.release.tag_name }}' # e.g., v1.2.3
          ver="${ref#v}"                            # -> 1.2.3
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Ensure cache dir exists so setup-dotnet's cache post-step doesn't error
      - name: Ensure NuGet cache directory exists
        run: mkdir -p "$HOME/.nuget/packages"

      - name: Restore (locked)
        run: dotnet restore --nologo --locked-mode

      - name: Pack (all packable projects in solution)
        run: |
          dotnet pack ./PavlovRcon.slnx \
            -c Release \
            -p:ContinuousIntegrationBuild=true \
            -p:PackageVersion='${{ steps.get_version.outputs.version }}' \
            --no-restore \
            -o ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Sign in to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for pkg in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
